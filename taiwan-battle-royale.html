<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣 22 縣市大亂鬥</title>
<style>
  :root {
    --bg: #0d1628; --panel: #15223d; --panel2: #1d2e50; --line: #2c4270;
    --text: #e9eef8; --muted: #8fa2c6; --accent: #ffd166; --red: #ef476f; --green: #06d6a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; font-weight: 900; }
  header .round { color: var(--accent); font-weight: 700; }
  main { flex: 1; display: flex; min-height: 0; }
  #mapWrap {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px;
    background: radial-gradient(ellipse at 60% 40%, #17345f 0%, #0f2240 55%, var(--bg) 100%);
  }
  #map { width: 100%; flex: 1; min-height: 0; max-height: calc(100vh - 90px); }
  .credit { font-size: 11px; color: var(--muted); opacity: .7; }
  .credit a { color: inherit; }
  aside { width: 400px; flex-shrink: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--line); overflow-y: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  button {
    font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #e85d04; border-color: #ff8c42; font-weight: 700; }
  button.on { background: var(--accent); color: #111; }
  .ctrls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .opts { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); gap: 6px 12px; flex-wrap: wrap; }
  .opts input[type=range] { width: 100px; vertical-align: middle; }

  /* 縣市圖鑑 */
  .phead { display: flex; gap: 10px; align-items: center; }
  .phead .sw { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; }
  .phead h2 { margin: 0; font-size: 19px; }
  .phead h2 small { font-size: 14px; color: var(--accent); margin-left: 4px; }
  .phead .sub { font-size: 12px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: 54px 1fr 28px; gap: 4px 8px; align-items: center; margin: 10px 0; font-size: 12px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; }
  .stats .v { text-align: right; color: var(--muted); }
  .ab { font-size: 13px; margin: 6px 0; line-height: 1.5; }
  .ab b { color: var(--accent); }
  .ab .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--panel2); color: var(--muted); margin-right: 4px; }
  .ab .tag.atk { color: #ff8fa3; } .ab .tag.def { color: #8ecae6; } .ab .tag.star { color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }

  #board { display: flex; flex-direction: column; gap: 3px; max-height: 230px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .row:hover { background: var(--panel2); }
  .row .rk { width: 18px; color: var(--muted); }
  .row .sw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .row .nm { font-weight: 700; width: 44px; }
  .row .ts { flex: 1; color: var(--muted); font-size: 12px; }
  .row .ct { color: var(--accent); white-space: nowrap; }
  .logcard { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
  #log { overflow-y: auto; font-size: 13px; line-height: 1.55; flex: 1; max-height: 420px; }
  .entry { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .entry .r { color: var(--muted); font-size: 11px; margin-right: 4px; }
  .entry.event { color: #a0e7ff; }
  .entry.skill { color: #ffc6ff; }
  .entry.big { color: var(--accent); font-weight: 700; }
  .entry .quip, .entry .notes { display: block; color: var(--muted); font-size: 12px; }
  .ftag { font-weight: 700; }

  /* 地圖 */
  .county { stroke: #0d1628; stroke-width: .9; stroke-linejoin: round; transition: fill .5s; cursor: pointer; }
  .county:hover { fill-opacity: .8; }
  .county.islet { stroke-width: 3.5; }
  .county.picked { stroke: #fff; stroke-width: 2; }
  .county.atk { animation: flashA .5s 3; }
  .county.def { animation: flashD .5s 3; }
  @keyframes flashA { 50% { fill-opacity: .55; } }
  @keyframes flashD { 50% { fill-opacity: .3; } }
  .lbl { text-anchor: middle; pointer-events: none; font-weight: 900; paint-order: stroke; stroke: rgba(5,10,20,.75); stroke-width: 3px; fill: #fff; }
  .lbl.name { font-size: 12px; }
  .lbl.owner { font-size: 9px; font-weight: 700; fill: #ffe9a8; }
  .sea { stroke: #7fa0d6; stroke-dasharray: 3 5; stroke-width: 1.3; opacity: .6; }
  .inset { fill: none; stroke: #3d5a8c; stroke-dasharray: 5 4; }
  .insetTxt { fill: var(--muted); font-size: 10px; }
  .arrow { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 9 6; animation: dash .45s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -15; } }

  #banner {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 10, 20, .75); z-index: 5; padding: 16px;
  }
  #banner[hidden] { display: none; }
  #banner .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 36px; text-align: center; max-width: 480px; }
  #banner h2 { margin: 0 0 8px; font-size: 32px; }
  #banner p { color: var(--muted); margin: 0 0 16px; }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    #mapWrap { height: 78vh; flex: none; }
    aside { width: 100%; border-left: 0; overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <h1>🇹🇼 台灣 22 縣市大亂鬥</h1>
  <span class="round" id="roundTxt">第 0 回合</span>
  <span id="aliveTxt"></span>
</header>
<main>
  <section id="mapWrap">
    <svg id="map" role="img" aria-label="台灣 22 縣市地圖"></svg>
    <div class="credit">地圖資料：<a href="https://github.com/dkaoster/taiwan-atlas" target="_blank" rel="noopener">taiwan-atlas</a>（MIT © Daniel Kao，原始資料：內政部國土測繪中心）・金門、馬祖為示意位置</div>
  </section>
  <aside>
    <div class="card">
      <div class="ctrls">
        <button id="stepBtn" class="primary">⏭ 單步執行</button>
        <button id="autoBtn">▶ 自動播放</button>
        <button id="resetBtn">↺ 重置</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="weighted" checked> 勝率依領土數微調</label>
        <label><input type="checkbox" id="special" checked> 特殊勝利條件</label>
        <label>速度 <input type="range" id="speed" min="1" max="10" value="5"></label>
      </div>
    </div>
    <div class="card" id="profile"></div>
    <div class="card">
      <h3 id="boardTitle">存活縣市排行榜</h3>
      <div id="board"></div>
    </div>
    <div class="card logcard">
      <h3>📢 戰況播報</h3>
      <div id="log"></div>
    </div>
  </aside>
</main>
<div id="banner" hidden>
  <div class="box">
    <h2 id="bannerTitle"></h2>
    <p id="bannerText"></p>
    <button id="bannerReset" class="primary">再來一場</button>
  </div>
</div>

const alive = () => [...new Set(Object.values(state.owner))];
const territories = f => COUNTIES.filter(c => state.owner[c.id] === f).map(c => c.id);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fTag = f => `<span class="ftag" style="color:${byId[f].color}">${byId[f].short}</span>`;
const fill = (tpl, A, D) => tpl.replaceAll('{A}', byId[A].short).replaceAll('{D}', byId[D].short);
const pct = v => `${v > 0 ? '+' : ''}${Math.round(v * 100)}%`;
const activeBonds = f => BONDS.filter(b => b.ids.every(id => state.owner[id] === f));

// ═══════════════ 勝率計算 ═══════════════
// 回傳攻方勝率與加成明細
function calcOdds(A, D, fromId, toId) {
  const sea = isSea(fromId, toId);
  const nA = territories(A).length, nD = territories(D).length;
  const notes = [];
  const add = (v, label) => { if (v) { p += v; notes.push(`${label} ${pct(v)}`); } };
  // 武力 vs 戰場縣市的地形防禦
  let p = 0.5 + (byId[A].stats.atk - byId[toId].stats.def) / 300;
  if (document.getElementById('weighted').checked) add((nA - nD) * 0.025, '領土差');
  add(byId[A].passive.mod({ role: 'atk', sea, toId, nSelf: nA, nOther: nD }), byId[A].passive.name);
  add(-byId[D].passive.mod({ role: 'def', sea, toId, nSelf: nD, nOther: nA }), byId[D].passive.name);
  // 宿敵：雙方互相列為宿敵且數值相同時會抵銷，就不顯示
  const rA = byId[A].rivals.find(r => r.id === D), rD = byId[D].rivals.find(r => r.id === A);
  if (!(rA && rD && rA.v === rD.v)) {
    if (rA) add(rA.v, rA.name);
    if (rD) add(-rD.v, rD.name);
  }
  for (const b of activeBonds(A)) if (b.atk) add(b.atk, b.name);
  for (const b of activeBonds(D)) if (b.def) add(-b.def, b.name);
  if (owns(A, 'kaohsiung') && sea) add(0.1, STRATEGIC.kaohsiung.name);
  if (owns(D, 'nantou')) add(-0.05, STRATEGIC.nantou.name);
  if (toId === 'kinmen') add(-0.15, STRATEGIC.kinmen.name);
  return { p, notes, sea, nA, nD };
}

// ═══════════════ 一回合 ═══════════════
function step() {
  if (state.over) return;
  state.round++;
  const A = pickAttacker();
  battle(A);
  // 晶片科技霸權：再行動一次
  if (!state.over && owns(A, 'hsinchucity') && alive().includes(A)) {
    log(`<span class="r">R${state.round}</span>💾 ${fTag(A)} 發動「${STRATEGIC.hsinchucity.name}」，再行動一次！`, 'skill');
    battle(A);
  }
  if (!state.over) checkSixCities();
  render();
}

// 六都制霸：同一勢力集齊六都並守住 SIX_HOLD 回合
const SIX_HOLD = 5;
function checkSixCities() {
  if (!document.getElementById('special').checked) return;
  const holder = state.owner[SIX_CITIES[0]];
  if (!SIX_CITIES.every(id => owns(holder, id))) {
    if (state.sixHolder) log(`🏙️ ${fTag(state.sixHolder)} 的六都被打破，制霸倒數中止！`, 'event');
    state.sixHolder = null;
    return;
  }
  if (state.sixHolder !== holder) {
    state.sixHolder = holder;
    state.sixSince = state.round;
    log(`🏙️ ${fTag(holder)} 集齊六都！再守住 ${SIX_HOLD} 回合就達成「六都制霸」特殊勝利！`, 'big');
  } else if (state.round - state.sixSince >= SIX_HOLD) {
    finish(holder, `第 ${state.round} 回合達成「六都制霸」特殊勝利！其他縣市表示：好啦你最大。`);
  }
}

function pickAttacker() {
  // 有敵對鄰居的勢力才能當攻方；佔領台北（首都光環）的勢力權重 ×1.5
  const cands = alive().filter(f => territories(f).some(id => [...ADJ[id]].some(n => state.owner[n] !== f)));
  const w = cands.map(f => owns(f, 'taipei') ? 1.5 : 1);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) { r -= w[i]; if (r <= 0) return cands[i]; }
  return cands[cands.length - 1];
}

function battle(A) {
  const fronts = [];
  for (const id of territories(A)) for (const n of ADJ[id]) if (state.owner[n] !== A) fronts.push([id, n]);
  const [fromId, toId] = pick(fronts);
  const D = state.owner[toId];
  const R = `<span class="r">R${state.round}</span>`;
  const o = calcOdds(A, D, fromId, toId);
  let p = o.p, forced = null;
  flash(fromId, toId, A);

  // 在地事件 20%
  if (Math.random() < 0.2) {
    const ev = pick(EVENTS.filter(e => e.when(A, D)));
    log(R + ev.text, 'event');
    if (ev.once) state[ev.once] = true;
    if (ev.effect === 'cancel') return;
    if (ev.effect === 'defend') forced = false;
    else { p += ev.effect; o.notes.push(`事件 ${pct(ev.effect)}`); }
  }
  // 必殺技：神秘度越高越容易發動
  const atkSkill = Math.random() < byId[A].stats.meme / 260 ? pick(byId[A].skills.filter(s => s.role === 'atk')) : null;
  if (atkSkill && forced === null) {
    log(`${R}✨ ${fTag(A)} 發動必殺技「${atkSkill.name}」：${atkSkill.desc}！`, 'skill');
    p += atkSkill.effect;
    o.notes.push(`${atkSkill.name} ${pct(atkSkill.effect)}`);
  }
  const defSkill = Math.random() < byId[D].stats.meme / 320 ? pick(byId[D].skills.filter(s => s.role === 'def')) : null;
  if (defSkill && forced === null) {
    log(`${R}🛡️ ${fTag(D)} 發動必殺技「${defSkill.name}」：${defSkill.desc}！`, 'skill');
    if (defSkill.effect === 'cancel') return;
    if (defSkill.effect === 'defend') forced = false;
    else { p -= defSkill.effect; o.notes.push(`${defSkill.name} ${pct(-defSkill.effect)}`); }
  }
  p = Math.min(0.9, Math.max(0.1, p));

  const win = forced ?? Math.random() < p;
  const via = o.sea ? '渡海' : '';
  const notes = `<span class="notes">${o.notes.join('｜') || '無加成'}｜攻方勝率 ${Math.round(p * 100)}%</span>`;
  if (win) {
    const lost = territories(D);
    lost.forEach(id => { state.owner[id] = A; });
    log(`${R}⚔️ ${fTag(A)} 從 ${byId[fromId].short} ${via}出兵攻破 ${byId[toId].short}，${fTag(D)} 勢力 ${lost.length} 塊領土全數併入！
      ${notes}<span class="quip">${fill(pick(WIN_QUIPS), A, D)}</span>`);
    for (const id of lost) if (STRATEGIC[id]) log(`🏯 ${fTag(A)} 取得戰略要地 ${byId[id].short}「${STRATEGIC[id].name}」：${STRATEGIC[id].desc}`, 'skill');
    if (alive().length === 1) return finish(A, `第 ${state.round} 回合統一全台！全台改用 ${byId[A].short} 的垃圾車音樂。`);
    log(`💀 ${byId[D].short} 出局，剩 ${alive().length} 個縣市勢力。`, 'big');
  } else {
    log(`${R}🛡️ ${fTag(D)} 在 ${byId[toId].short} 擋下了 ${fTag(A)} 的${via}進攻！
      ${notes}<span class="quip">${fill(pick(LOSE_QUIPS), A, D)}</span>`);
  }
}

function finish(w, text) {
  state.over = true;
  stopAuto();
  render();
  log(`👑 ${fTag(w)} ${text}`, 'big');
  document.getElementById('bannerTitle').innerHTML = `👑 ${byId[w].short}・${byId[w].title} 稱霸台灣！`;
  document.getElementById('bannerTitle').style.color = byId[w].color;
  document.getElementById('bannerText').textContent = `${byId[w].name}在${text}`;
  document.getElementById('banner').hidden = false;
  showProfile(w);
}

const delay = () => 1400 / Number(document.getElementById('speed').value);
function tick() { step(); if (!state.over) autoTimer = setTimeout(tick, delay()); }
function startAuto() { if (state.over) return; autoTimer = setTimeout(tick, 0); updateButtons(); }
function stopAuto() { clearTimeout(autoTimer); autoTimer = null; updateButtons(); }
function updateButtons() {
  const b = document.getElementById('autoBtn');
  b.textContent = autoTimer ? '⏸ 暫停' : '▶ 自動播放';
  b.classList.toggle('on', !!autoTimer);
  b.disabled = !!state?.over;
  document.getElementById('stepBtn').disabled = !!state?.over || !!autoTimer;
}

// ═══════════════ 地圖 ═══════════════
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const paths = {}, ownerLbls = {};
// 幾個環狀縣市（新北包台北、嘉縣包嘉市）的重心會落在別人身上，手動調整標籤位置
const LABEL_FIX = { newtaipei: [474, 125], chiayicounty: [292, 462], taipei: [466, 86], keelung: [524, 62] };
const ISLETS = ['penghu', 'kinmen', 'lienchiang'];
const labelPos = id => LABEL_FIX[id] || SHAPES.shapes[id].c;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function buildMap() {
  svg.setAttribute('viewBox', '0 0 600 800');
  for (const [id, b] of Object.entries(SHAPES.insets)) {
    el('rect', { x: b.x - 10, y: b.y - 20, width: b.w + 20, height: b.h + 30, rx: 8, class: 'inset' }, svg);
    el('text', { x: b.x - 4, y: b.y - 7, class: 'insetTxt' }, svg).textContent = `${byId[id].name}（示意位置）`;
  }
  const sea = el('g', {}, svg);
  for (const [a, list] of Object.entries(SEA_ADJ)) for (const b of list) {
    const [x1, y1] = labelPos(a), [x2, y2] = labelPos(b);
    el('line', { x1, y1, x2, y2, class: 'sea' }, sea);
  }
  const land = el('g', {}, svg);
  const lbls = el('g', {}, svg);
  COUNTIES.forEach(c => {
    const p = el('path', { d: SHAPES.shapes[c.id].d, class: 'county' + (ISLETS.includes(c.id) ? ' islet' : ''), 'fill-rule': 'evenodd' }, land);
    el('title', {}, p).textContent = `${c.name}・${c.title}`;
    p.addEventListener('click', () => showProfile(c.id));
    paths[c.id] = p;
    const [x, y] = labelPos(c.id);
    el('text', { x, y: y + 2, class: 'lbl name' }, lbls).textContent = (STRATEGIC[c.id] ? '★' : '') + c.short;
    ownerLbls[c.id] = el('text', { x, y: y + 13, class: 'lbl owner' }, lbls);
  });
  el('g', { id: 'arrows' }, svg);
  el('text', { x: 24, y: 785, class: 'insetTxt' }, svg).textContent = '★ = 戰略要地　虛線 = 海路（離島 ↔ 港口縣市）';
}
function flash(fromId, toId, A) {
  document.querySelectorAll('.county.atk, .county.def').forEach(h => h.classList.remove('atk', 'def'));
  void svg.getBoundingClientRect();
  paths[fromId].classList.add('atk');
  paths[toId].classList.add('def');
  const layer = document.getElementById('arrows');
  layer.innerHTML = '';
  const [x1, y1] = labelPos(fromId), [x2, y2] = labelPos(toId);
  const mx = (x1 + x2) / 2 - (y2 - y1) * 0.25, my = (y1 + y2) / 2 + (x2 - x1) * 0.25;
  el('path', { d: `M${x1},${y1}Q${mx},${my} ${x2},${y2}`, class: 'arrow', stroke: byId[A].color }, layer);
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { layer.innerHTML = ''; }, Math.max(500, delay() * 0.9));
}

// ═══════════════ 畫面更新 ═══════════════
function render() {
  COUNTIES.forEach(c => {
    const f = state.owner[c.id];
    paths[c.id].style.fill = byId[f].color;
    // 離島太小，用同色粗外框放大顯示
    if (ISLETS.includes(c.id)) paths[c.id].style.stroke = byId[f].color;
    paths[c.id].classList.toggle('picked', c.id === pickedId);
    ownerLbls[c.id].textContent = f === c.id ? '' : `屬${byId[f].short}`;
  });
  const list = alive().map(f => ({ f, ts: territories(f) })).sort((a, b) => b.ts.length - a.ts.length);
  document.getElementById('board').innerHTML = list.map((x, i) => `<div class="row" data-id="${x.f}">
    <span class="rk">${i + 1}</span><span class="sw" style="background:${byId[x.f].color}"></span>
    <span class="nm">${byId[x.f].short}</span><span class="ts">${x.ts.map(id => byId[id].short).join('、')}</span>
    <span class="ct">${x.ts.length} 塊</span></div>`).join('');
  document.getElementById('roundTxt').textContent = `第 ${state.round} 回合`;
  document.getElementById('aliveTxt').textContent = `存活 ${list.length} / 22`;
  document.getElementById('boardTitle').textContent = `存活縣市排行榜（${list.length} / 22）`;
  showProfile(pickedId);
  updateButtons();
}

const STAT_LABELS = [['eco', '經濟力', '#06d6a0'], ['atk', '武力值', '#ef476f'], ['def', '防禦力', '#4cc9f0'], ['meme', '神秘度', '#c77dff']];
function showProfile(id) {
  pickedId = id;
  Object.entries(paths).forEach(([k, p]) => p.classList.toggle('picked', k === id));
  const c = byId[id], f = state.owner[id];
  const ownerTxt = f === id ? '獨立中' : `已被 ${fTag(f)} 併吞`;
  const myTerr = territories(id);
  const bonds = BONDS.filter(b => b.ids.includes(id));
  document.getElementById('profile').innerHTML = `
    <div class="phead"><span class="sw" style="background:${c.color}"></span>
      <div><h2>${c.name}<small>${c.title}</small></h2>
      <div class="sub">${ownerTxt}${myTerr.length ? `・勢力 ${myTerr.length} 塊領土` : '・勢力已滅亡'}</div></div></div>
    <div class="stats">${STAT_LABELS.map(([k, label, color]) => `<span>${label}</span>
      <div class="bar"><i style="width:${c.stats[k]}%;background:${color}"></i></div><span class="v">${c.stats[k]}</span>`).join('')}</div>
    <div class="ab"><span class="tag">被動</span><b>${c.passive.name}</b>：${c.passive.desc}</div>
    ${c.skills.map(s => `<div class="ab"><span class="tag ${s.role}">${s.role === 'atk' ? '進攻必殺' : '防守必殺'}</span><b>${s.name}</b>：${s.desc}
      （${typeof s.effect === 'number' ? `勝率 ${s.role === 'atk' ? '+' : '-'}${Math.round(s.effect * 100)}%` : s.effect === 'defend' ? '直接防守成功' : '取消這次進攻'}）</div>`).join('')}
    ${c.rivals.map(r => `<div class="ab"><span class="tag">${r.v > 0 ? '宿敵' : '被剋'}</span><b>${r.name}</b>：對上 ${byId[r.id].short} 時勝率 ${pct(r.v)}</div>`).join('')}
    ${bonds.map(b => `<div class="ab"><span class="tag">羈絆</span><b>${b.name}</b>：同時擁有 ${b.ids.map(i => byId[i].short).join('＋')} 時${b.desc}</div>`).join('')}
    ${STRATEGIC[id] ? `<div class="ab"><span class="tag star">戰略要地</span><b>${STRATEGIC[id].name}</b>：${STRATEGIC[id].desc}</div>` : ''}
    ${SIX_CITIES.includes(id) ? `<p class="hint">🏙️ 六都之一：同一勢力集齊六都並守住 ${SIX_HOLD} 回合，即達成「六都制霸」特殊勝利</p>` : ''}`;
}

function log(html, cls = '') {
  const box = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'entry ' + cls;
  div.innerHTML = html;
  box.prepend(div);
  while (box.children.length > 250) box.lastChild.remove();
}

// ═══════════════ 綁定 ═══════════════
document.getElementById('stepBtn').addEventListener('click', step);
document.getElementById('autoBtn').addEventListener('click', () => autoTimer ? stopAuto() : startAuto());
document.getElementById('resetBtn').addEventListener('click', reset);
document.getElementById('bannerReset').addEventListener('click', reset);
document.getElementById('board').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) showProfile(r.dataset.id); });

buildMap();
reset();
</script>
</body>
</html>
